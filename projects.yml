research:
  repo: https://github.com/robertnowell
  kind: research-feed
  audience: founders-solopreneurs
  status: live
  post_type: research
  problem: Most takes you read are secondhand opinion with no paper trail. I run
    multi-source deep research with tiered sources and verification, and post 
    only what survived it.
  solution_one_liner: 'A daily research thread: the most surprising verified finding
    from my own deep-research reports, with sources named.'
  channels:
    - bluesky
  facts:
    - The text watermark and C2PA file metadata carry no user-, account-, 
      organization-, or session-identifying information, by Anthropic's own 
      repeated, direct statement. Reconfirmed independently in this pass across 
      three separately-run agents citing Anthropic's own support article and 
      news announcement. "Watermarking carries no identifying information and 
      can't be traced to a specific person,…
    - "The text watermark is a statistical token-selection pattern (derived from Google
      DeepMind's SynthID-Text), not an embedded signature. A secret key plus preceding
      context words bias token-sampling randomness; no hidden characters or extra
      tokens are inserted, so it adds no latency or cost. Detection requires the same
      secret key Anthropic holds: this is a single shared \"Claude-consistent or not\"\
      …"
    - 'C2PA content-credentials metadata for image/media files (.png/.jpg/.svg and
      others) is a separate mechanism from the text watermark: a cryptographically
      signed provenance "receipt" attached to the file, not embedded in pixels, rolled
      out worldwide (not EU-only) from August 2, 2025. It proves tamper-evidence,
      not identity. ### Two separate tools, and who can use each'
    - A free, public, ungated "Content Checker" and a separate, 
      eligibility-gated "Detection API" both exist and must not be conflated, 
      now confirmed directly from Anthropic's own site, not merely a secondhand 
      snippet. The Content Checker (claude.com/check-content; a 
      claude.com/check-files alias also resolves to the same tool) reads C2PA 
      Content Credentials client-side on media files up to 100MB,…
    - 'The text-watermark Detection API remains in private preview as of this pass,
      with no GA date, pricing, or rate limits published. Eligibility is limited to
      named categories: regulators, law enforcement, media, fact-checkers, independent
      researchers, educational organizations, EU civil society groups, and enterprises
      with their own EU AI Act compliance obligations. Access is requested through
      a…'
    - EU AI Act Article 50 itself imposes no legal-process precondition on who 
      may query a provider's detection tool. The statute requires providers to 
      make AI-generated content machine-detectable; it says nothing about a 
      court order, warrant, or judicial-authorization mechanism gating access to
      a detection tool. The entire eligibility/intake design (the Google Form, 
      the named categories) is…
    - No disclosure exists anywhere, support article, announcement, Content 
      Checker page, or access-request form, of whether Anthropic logs or retains
      records of who runs a detection check, what content was checked, or the 
      result. This absence was checked explicitly across all four 
      Anthropic-controlled artifacts in this pass (not merely assumed from one 
      page) and is consistent with the same gap flagged…
    - "Identifying a specific person still requires a separate, legal-process-gated
      step against Anthropic's ordinary account records, a subpoena or validly issued
      warrant, entirely independent of the watermark/detector system. Anthropic's
      policy: \"Anthropic does not disclose information about customers or end users
      of our services in response to government requests except in accordance with
      valid legal…"
    - User notification is the default. Anthropic states it will notify users 
      their data was requested "unless we believe we're legally prohibited from 
      doing so, or other rare exceptions apply." For API/enterprise customers, 
      requesters are generally directed to the customer first rather than to 
      Anthropic directly.
    - Neither of Anthropic's two official legal-process policy pages mentions 
      National Security Letters, FISA orders, or gag orders anywhere, confirmed 
      by direct fetch in this pass. Any claim that NSL/FISA process applies 
      comes only from a search engine's own synthesized paraphrase of a 
      Government Requests Report PDF that could not be directly rendered or 
      quoted (see Finding 12); treat as unconfirmed.…
    - This thread comes from the operator's own multi-source deep-research 
      report '2026-09-04-claude-watermark-traceability' dated 2026-09-04, and 
      from a simulated review round where 10 agent-written posts were ranked by 
      votes.
  angles:
    - id: 2026-09-04-even-with-no-attack-at-all-claude-s-wate
      summary: "Even with no attack at all, Claude's watermark family misses AI text
