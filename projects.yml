research:
  repo: https://github.com/robertnowell
  kind: research-feed
  audience: founders-solopreneurs
  status: live
  post_type: research
  problem: Most takes you read are secondhand opinion with no paper trail. I run
    multi-source deep research with tiered sources and verification, and post 
    only what survived it.
  solution_one_liner: 'A daily research thread: the most surprising verified finding
    from my own deep-research reports, with sources named.'
  channels:
    - bluesky
  facts:
    - "The standard causal technique is a recipient-level randomized holdout, not
      an A/B test that \"runs longer.\" — Confidence: Established Klaviyo's Global
      Holdout Groups suppresses a percentage of profiles from all marketing and compares
      purchase behavior between groups [Tier 1]; Bluecore's engineering implementation
      assigns holdouts via `FARM_FINGERPRINT(customer_id + per-campaign salt)` so…"
    - "Klaviyo gates account-wide holdout measurement to 400,000+ profiles — a Tier-1
      admission of the statistical power problem. — Confidence: Established Below
      a certain list size, holdouts can't be powered adequately; Klaviyo recommends
      a 3-month runtime [Tier 1]."
    - "Sample-size math gets audience-prohibitive fast, and it must be decided pre-send.
      — Confidence: Likely Worked example: detecting a 1pp lift on a 3% baseline at
      95% confidence / 80% power needs 5,302 per arm (~10,600 total) [Tier 3, formula-verified].
      Evan Miller's n = 16σ²/δ² (σ² = p(1−p)) confirmed at the primary source; the
      constant 16 comes from the 80%-power/5%-significance convention (Lehr's…"
    - 'Because sends are finite, practitioners explicitly trade statistical rigor
      for audience cost. — Confidence: Likely Documented framing: "conservative" 95%
      confidence / 80% power / 50-50 split vs "aggressive" 95% / 50% power / 90-10
      split [Tier 3]. Practitioner holdout sizes cluster at 10–20% of the eligible
      audience, 2–4 weeks minimum duration [Tier 3, corroborated].'
    - 'Recipient-level (not session-level) randomization is required because of carryover
      contamination. — Confidence: Likely Simulation evidence: with carryover, session-level
      randomization shrank a true 2% effect to a measured 1.4% and dropped detection
      from 100% to 90% [Tier 3]; consistent with Klaviyo/Bluecore recipient-grain
      designs [Tier 1/2].'
    - 'Apple MPP has destroyed opens as a metric: >50% of opens occur on MPP-active
      devices, and pre/post data shows opens inflating while clicks stayed flat. —
      Confidence: Established (mechanics) / Likely (magnitudes) MPP (Sept 20, 2021)
      pre-fetches tracking pixels at delivery whether or not the email is read, via
      Apple proxies that anonymize IP/user-agent [Tier 1, SendGrid docs]. Litmus:
      >50% of opens…'
    - "Clicks are only relatively trustworthy: bot/security-scanner clicks run ~20%
      with basic detection and approach 50% with third-party intelligence. — Confidence:
      Likely Mailchimp's internal testing [Tier 2]; mechanism confirmed at Tier 1
      — Microsoft Safe Links (and Proofpoint URL Defense) rewrite every link and re-fetch
      destinations at delivery-scan time and at click time."
    - 'Klaviyo attribution is last-touch within short windows, and Klaviyo itself
      rebuilt it to filter MPP phantom opens and bot clicks — a Tier-1 admission the
      over-attribution was real. — Confidence: Established Defaults: email 5 days
      (opens and clicks count), SMS 1-day opens/5-day clicks, push 24h; last-touch
      across channels; windows adjustable 1–30 days [Tier 1]. The update added bot-click…'
    - 'No verifiable, email-specific "attribution overstates by X%" number exists
      — a verified negative. — Confidence: Established (as a gap) The circulating
      figures — agency "70% rule" (Klaviyo-attributed ≈ 70–85% of true email revenue),
      "20–50% inflation" — are Tier-3 heuristics, not audited studies. A targeted
      verification pass chased every named lead (Ryan Healy client audit: qualitative
      bug…'
    - "The best rigorous quantification of the attribution-vs-incrementality gap is
      paid-ads-only: ByteDance's ADKDD 2026 paper found raw attribution overestimated
      true experimental lift by 179–334% across channel slices. — Confidence: Established
      (for paid ads; analogy only for email) Their cannibalization-corrected method
      cut normalized calibration error by 91.38% [Tier 1, arXiv 2606.26690]. Citing…"
    - This thread comes from the operator's own multi-source deep-research 
      report '2026-07-20-email-incrementality-measurement' dated 2026-07-27, and
      from a simulated review round where 10 agent-written posts were ranked by 
      votes.
