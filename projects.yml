research:
  repo: https://github.com/robertnowell
  kind: research-feed
  audience: founders-solopreneurs
  status: live
  post_type: research
  problem: Most takes you read are secondhand opinion with no paper trail. I run
    multi-source deep research with tiered sources and verification, and post 
    only what survived it.
  solution_one_liner: 'A daily research thread: the most surprising verified finding
    from my own deep-research reports, with sources named.'
  channels:
    - bluesky
  facts:
    - '### Launch post-mortems (Tier 1 numbers via HN Algolia + GitHub API)'
    - "The strong Show HN anatomy — Established. Omnara Show HN 310pts/168cm (Aug
      2025), Conductor 228/115, Vibe Kanban 195/132 all share: first-person \"I'm
      [name], one of the creators\"; concrete personal-pain origin (Vibe Kanban: \"\
      doomscrolling during 2-5 min agent waits\"); dogfooding proof; explicit responsiveness
      promise. SKI's Show HN got 15 points because a non-maker account posted it same-day
      as…"
    - "PH vs HN: SKI took PH #1 (641 votes, #3 of week) while its HN flopped — PH
      rewards coordinated same-day mobilization (followers, maker graph, leaderboard);
      HN rewards founder presence and story. No data-backed sequencing study found
      (gap); the defensible read: they're different games; run HN with full founder
      apparatus first (OSS-native audience), PH as a separate day with the video."
    - 'A launch moment is optional: Claude Squad = 8,239★ with a 5-point non-Show-HN
      as its only HN appearance — Established.'
    - "Omnara's warm-up: category-definition essay posted 3 days before Launch HN
      (\"Everyone's building 'async agents'…\", 63pts) — deliberate pre-framing —
      Established."
    - 'OpenClaw (385,364★, GitHub-verified) is not the playbook: growth contested
      by its own community (auto-star-on-install allegations, abnormal star velocity)
      and sustained by controversy cycles (bans/reversals/security scares at 1099/802/667/514pts).
      Adversarial-attention growth contradicts calm-competence — Established for the
      numbers, Contested for the causal story.'
    - "Conductor raised $22M Series A post-launch (follow-up HN posts got 3pts — funding
      news doesn't re-trigger HN) — Likely. ### Video/demo strategy"
    - "Nobody in the category has shipped a convincing video demo — Established (direct
      fetches): SKI's PH gallery = 6 static images, zero videos; heyski.io has no
      embedded player; Wispr Flow's hero = text before/after + WPM stats, no audio/video
      (their YouTube is a secondary surface). A real demo video is an open differentiator,
      not table stakes."
    - "The credible voice-demo doctrine (consistent across Tavis Rudd PyCon 2013,
      Emily Shea's Talon talks, Josh Comeau's hands-free post): live, unedited, real
      loop shown before any explanation — screen-recording + real voice, never produced
      trailer. Comeau opens with the video \"to prove feasibility.\" Shea's most-cited
      talk showcased the bespoke workflow built on top, not the base tool — maps directly…"
    - "Landing-page split: hero should convert MUTED (Wispr's choice); the sound-on
      video carries YouTube/social discovery — Emerging (inference from Wispr + PH
      sound-off norms)."
    - This thread comes from the operator's own multi-source deep-research 
      report '2026-08-06-retrofire-launch-channels' dated 2026-08-08, and from a
      simulated review round where 9 agent-written posts were ranked by votes.
  angles:
