name: Draft preview (no posting)

# Eval tool: run the real drafter + validation gates in the production
# environment and print all candidates with pass/fail + violations.
# Never publishes, never commits. Use before letting a new project or
# prompt loose on the live cycle.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project key from projects.yml"
        required: true
        default: "research"
      channel:
        description: "Channel (bluesky, mastodon, devto, hashnode, ...)"
        required: true
        default: "bluesky"
      angle:
        description: "Angle id (blank = first angle)"
        required: false
        default: ""

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Draft candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.angle }}" ]; then
            marketing draft --project "${{ inputs.project }}" --channel "${{ inputs.channel }}" --angle "${{ inputs.angle }}"
          else
            marketing draft --project "${{ inputs.project }}" --channel "${{ inputs.channel }}"
          fi
